# Production — portable VPS (Namecheap Quasar, etc.)
# Publishes 127.0.0.1:7070 only — host Caddy owns 80/443 (avoids gutexcellence :3000/:3001, brokenloop :8082/:8083, :8084/:8085). :7071 reserved.
#
# Usage:
#   cp .env.production.example .env.production
#   # edit JWT_SECRET, ORIGIN, ANTHROPIC_API_KEY
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Quasar (1GB RAM): add 2G swap before first build if the build OOMs.
# DB persists in volume wingspan-db-prod.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        BUILD_DATE: ${BUILD_DATE:-}
        VCS_REF: ${VCS_REF:-}
        VERSION: ${VERSION:-1.0.0}
    container_name: wingspan-score-prod
    ports:
      - "127.0.0.1:7070:3000"
    volumes:
      - wingspan-db-prod:/app/database
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/app/database/wingspan.db
      - PORT=3000
      - HOST=0.0.0.0
      - PROTOCOL_HEADER=x-forwarded-proto
      - HOST_HEADER=x-forwarded-host
      - BODY_SIZE_LIMIT=12582912
      - NODE_OPTIONS=--max-old-space-size=384
    restart: unless-stopped
    networks:
      - wingspan-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)}).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

volumes:
  wingspan-db-prod:
    driver: local

networks:
  wingspan-network:
    driver: bridge
